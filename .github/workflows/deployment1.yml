name : Deployment Exercise
on: push
jobs:
    lint:
        runs-on : ubuntu-latest
        steps:
            - name : Get Code
              uses: actions/checkout@v4
            - name: Install NodeJS
              uses: actions/setup-node@v4
              with:
                node-version: 20
            - name : Install Dependencies
              run : npm ci
            - name: Run Lint
              run: npm run lint


    test: 
        needs: lint
        runs-on: ubuntu-latest
        steps:
            - name : Get Code
              uses: actions/checkout@v4
            - name: Install NodeJS
              uses: actions/setup-node@v4
              with:
                node-version: 20
            - name : Install Dependencies
              run : npm ci
            - name: Run Tests 
              run: npm test


    deploy: 
        needs: test
        runs-on: ubuntu-latest
        steps:
            - name : Get Code
              uses: actions/checkout@v4
            - name: Install NodeJS
              uses: actions/setup-node@v4
              with:
                node-version: 20
            - name : INstall Dependencies
              run : npm ci
            - name: Build Project
              run: npm run build
            - name: Deploy Project
              run: echo "Deploying Project"